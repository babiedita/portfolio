<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parcerias — Babi Edita</title>
  <link rel="stylesheet" href="https://use.typekit.net/ndv3lae.css">
  <link rel="stylesheet" href="style.css?v=100">
</head>
<body class="subpage">
  <nav class="subpage-nav">
    <a href="index.html#trabalho">trabalho</a>
    <a href="index.html#clientes">clientes</a>
    <a href="index.html#contato">contato</a>
    <a href="parcerias.html">parcerias</a>
    <a href="tutoriais.html">tutoriais</a>
  </nav>

  <div class="music-player" id="musicPlayer">

  <img
    class="music-cover"
    id="musicCover"
    src="covers/miimaker.png"
    alt=""
  >

  <div class="music-info">

    <span class="music-now">
      Você está ouvindo agora:
    </span>

    <span class="music-title" id="musicTitle">
      Mii Maker Editing Mii
    </span>

  </div>

  <div class="music-controls">

    <button
      class="music-control"
      id="musicPrev"
      type="button"
      aria-label="Música anterior"
    >
      ◀◀
    </button>

    <button
      class="music-control music-play"
      id="musicPlay"
      type="button"
      aria-label="Tocar ou pausar"
    >
      ▶
    </button>

    <button
      class="music-control"
      id="musicNext"
      type="button"
      aria-label="Próxima música"
    >
      ▶▶
    </button>

  </div>

  <button
    class="music-close"
    id="musicClose"
    type="button"
    aria-label="Fechar player"
  >
    ×
  </button>

  <audio id="backgroundAudio" preload="auto"></audio>

</div>
  
  <main class="subpage-main">
    <div>
      <h1>parcerias</h1>
      <p>página em construção.</p>
    </div>
  </main>
</body>
</html>
