<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Vídeos — Babi Edita
  </title>

  <link
    rel="stylesheet"
    href="https://use.typekit.net/ndv3lae.css"
  >

  <link
    rel="stylesheet"
    href="style.css?v=400"
  >

</head>


<body
  class="videos-page"
  data-page="videos"
>


<nav class="subpage-nav">

  <a href="index.html#trabalho">
    trabalho
  </a>

  <a href="index.html#clientes">
    clientes
  </a>

  <a href="index.html#contato">
    contato
  </a>

  <a href="parcerias.html">
    parcerias
  </a>

  <a href="tutoriais.html">
    tutoriais
  </a>

</nav>


<div
  class="music-player"
  id="musicPlayer"
>

  <img
    class="music-cover"
    id="musicCover"
    src="covers/miimaker.png"
    alt=""
  >

  <div class="music-info">

    <span class="music-now">
      Você está ouvindo agora:
    </span>

    <span
      class="music-title"
      id="musicTitle"
    >
      Mii Maker Editing Mii
    </span>

  </div>


  <div class="music-controls">

    <button
      class="music-control"
      id="musicPrev"
      type="button"
    >
      ◀◀
    </button>

    <button
      class="music-control music-play"
      id="musicPlay"
      type="button"
    >
      ▶
    </button>

    <button
      class="music-control"
      id="musicNext"
      type="button"
    >
      ▶▶
    </button>

  </div>


  <button
    class="music-close"
    id="musicClose"
    type="button"
  >
    ×
  </button>


  <audio
    id="backgroundAudio"
    preload="auto"
    autoplay
  ></audio>

</div>


<div
  class="music-player-mini is-hidden"
  id="musicPlayerMini"
>

  <button
    class="music-mini-control"
    id="musicMiniPrev"
    type="button"
  >
    ◀◀
  </button>

  <button
    class="music-mini-control music-mini-play"
    id="musicMiniPlay"
    type="button"
  >
    ▶
  </button>

  <button
    class="music-mini-control"
    id="musicMiniNext"
    type="button"
  >
    ▶▶
  </button>

</div>



<main class="videos-library">


  <div class="videos-library-head">

    <h1>
      vídeos
    </h1>

    <p>
      todos os trabalhos
    </p>

  </div>


  <section class="videos-work-section">

    <div class="filter-wrap">

      <p class="filter-label">
        Filtrar por:
      </p>

      <div class="filters">

        <button
          class="filter-btn active"
          type="button"
          data-filter="curto"
        >
          <span>
            Shorts/Reels
          </span>
        </button>

        <button
          class="filter-btn"
          type="button"
          data-filter="longo"
        >
          <span>
            Longform
          </span>
        </button>

      </div>

    </div>


    <div
      class="video-grid"
      id="videoGrid"
    ></div>

  </section>


</main>



<div
  class="video-modal"
  id="videoModal"
  aria-hidden="true"
>

  <button
    class="modal-close"
    id="modalClose"
    type="button"
  >
    ×
  </button>


  <div
    class="modal-inner"
    id="modalInner"
  >

    <iframe
      id="youtubePlayer"
      src=""
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen
    ></iframe>

  </div>

</div>


<script src="script.js?v=400"></script>

</body>
</html>
